# Configuração local do Supabase CLI para este projeto.
# Gerado como referência inicial — ajuste conforme necessário após
# `supabase init` / `supabase link`.

project_id = "ev-charging-scheduler"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
# Cadastro de unidades é feito pelo síndico (RF-01), não é self-service —
# por isso enable_signup fica desligado; o convite é enviado por e-mail.

[auth.email]
enable_confirmations = true
# Validade do link/código de convite (e de outros e-mails de auth, como
# recuperação de senha) — mesmo campo controla os dois. Ajustado de 1h
# (padrão) pra 24h em 2026-08 porque conta pendente pode levar mais
# tempo pra ser aceita. Precisa ser replicado manualmente no dashboard
# do projeto (Authentication → Providers → Email), esse arquivo só
# reflete/documenta o valor.
otp_expiry = 86400

[auth.email.template.invite]
subject = "Você foi convidado(a) para o Grand Soleil"
content_path = "./supabase/templates/invite.html"

[edge_runtime]
enabled = true
